version: '3.9'

services:
  # PostgreSQL database with PostGIS
  db:
    image: postgis/postgis:16-3.4
    container_name: winterswim-db
    environment:
      POSTGRES_DB: ${DB_NAME:-winterswim}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - winterswim-network

  # Django web application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: winterswim-web
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      # Django settings
      DJANGO_ENV: ${DJANGO_ENV:-development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-key-change-in-production}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}

      # Database settings
      DB_NAME: ${DB_NAME:-winterswim}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432

      # Superuser (optional, for automatic creation)
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
    volumes:
      # Mount code for hot reload in development
      - .:/app
      # Named volumes for persistent data
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - winterswim-network
    stdin_open: true
    tty: true

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local
  static_data:
    driver: local

networks:
  winterswim-network:
    driver: bridge
