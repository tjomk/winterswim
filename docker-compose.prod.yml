version: '3.9'

# Production overrides for docker-compose
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  web:
    # Use gunicorn in production
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
    environment:
      DJANGO_ENV: production
      DEBUG: "False"
    # Don't mount source code in production
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports: []  # Don't expose Django directly - only via nginx
    restart: unless-stopped

  db:
    restart: unless-stopped

  # Nginx reverse proxy (for production)
  nginx:
    image: nginx:alpine
    container_name: winterswim-nginx
    ports:
      - "8186:80"  # Expose nginx on 8186 instead of Django
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - winterswim-network
    restart: unless-stopped
